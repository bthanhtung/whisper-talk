---
layout: default
---
<article class="page wrap-narrow">
  <header class="page-head">
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.subtitle -%}<p class="page-sub">{{ page.subtitle }}</p>{%- endif -%}
  </header>
  {%- if page.image -%}
  <figure class="page-cover"><img src="{{ page.image | relative_url }}" alt="" decoding="async"></figure>
  {%- endif -%}
  <div class="prose">
    {{ content }}
  </div>
</article>
