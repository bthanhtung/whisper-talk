<div class="card mb-5 d-flex flex-column flex-md-row justify-content-between main-loop-card p-4 border-0 border-radius-lg">
    <div class="pr-md-4 order-2 order-md-1 w-100 pt-3 pt-md-0">
        <h2 class="mb-2 h4 font-weight-bold">
        <a class="text-dark" href="{{site.baseurl}}{{post.url}}">{{ post.title }}</a>
        </h2>
        <p class="excerpt mb-3">
           {{ post.excerpt  | strip_html | strip_newlines | truncate: 186}}
        </p>
        <small class="d-block text-muted">
            In <span class="catlist">
            {% for category in post.categories %}
            <a class="text-capitalize text-muted smoothscroll" href="{{site.baseurl}}/categories.html#{{ category | downcase }}">{{ category }}</a><span class="sep">, </span>
            {% endfor %}
            </span>
        </small>
        <small class="text-muted">
            {{ post.date | date: '%b %d, %Y' }}
        </small>
    </div>
    {% if post.image %}
        <div class="col-12 col-md-4 p-0 order-1 order-md-2">
        <a href="{{site.baseurl}}{{post.url}}">
        <img class="w-100 rounded" style="object-fit:cover; aspect-ratio:16/9;" src="{% if post.image contains "://" %}{{ post.image }}{% else %}{{ site.baseurl }}/{{ post.image }}{% endif %}" alt="{{ post.title }}">
        </a>
        </div>
    {% endif %}
</div>
