<link rel="icon" href="{{ site.favicon | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/images/logo.png' | relative_url }}">
<script>
  // đặt theme + cỡ chữ trước khi vẽ để khỏi nháy màn hình
  (function () {
    try {
      var t = localStorage.getItem('wt-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      var f = localStorage.getItem('wt-font');
      if (f) document.documentElement.style.setProperty('--prose-size', f);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
